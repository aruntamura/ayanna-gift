# Deploys the site to GitHub Pages.
#
# NOTE: Pages does not serve private repositories on the free plan. Enabling
# Pages on this repo today returns:
#
#   422  Your current plan does not support GitHub Pages for this repository.
#
# So this workflow is committed but DISABLED, otherwise it fails on every push
# at the configure-pages step and mails you about it. To publish later:
#
#   1. make the repo public, or move the account to a paid plan
#   2. Settings > Pages > Source: GitHub Actions
#   3. gh workflow enable "Deploy to Pages"
#
# Nothing in the workflow itself needs changing. Its puzzle-grid check already
# passes in CI.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the puzzle grid still matches the word list
        run: |
          node tools/build-puzzle.mjs
          git diff --exit-code data/puzzle.js \
            || (echo "::error::data/puzzle.js is out of date. Run node tools/build-puzzle.mjs and commit." && exit 1)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
